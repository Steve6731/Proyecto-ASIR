<body>
   <input id="fileInput" type="file" style="display: none;"/>

   <div id="iframeView">
      <iframe id="myIframe" src="about:blank"
      srcdoc="

   // por favor, no le den importancia.

   function greet(name) {
      console.log("Hello, " + name);
   }
   </textarea>
   </div>
   <script>
      var myCodeMirror = CodeMirror.fromTextArea(document.getElementById('myEditor'), {
         lineNumbers: true,
         mode: "javascript",
         theme: "monokai",
         lineWrapping: true
      });
   </script>

         <div><button onclick="sidebarChangeTabRight('elementConfig')">Element</button></div>

      </div>
      <!-- -->

   <div id="bottomToolbar" class="bottom-toolbar">
      <select id="IframeScaleController">
         <option value="0.25">25%</option>

         <option value="1.00">100%</option>
         <option value="1.50">150%</option>
         <option value="2.00">200%</option>

      <button class="toolbar-btn" >🔔</button>
