<!doctype html>
<html lang="us">
<head>
	<meta charset="utf-8">
	<title>Proyect</title>

   <!-- codemirror Corelib -->
   <script src="codeMirror/lib/codemirror.js"></script>
   <!-- JavaScript for codeMirror-->
   <script src="codeMirror/mode/javascript/javascript.js"></script>

   <script src="./js/lib/jquery/jquery.js"></script>
   <script src="./js/lib/sortableJS/Sortable.js"></script>
   <script src="./js/lib/JSzip/jszip.min.js"></script>
   
   <link rel="stylesheet" href="codeMirror/lib/codemirror.css">
   <link rel="stylesheet" href="codeMirror/theme/monokai.css">
   <link rel="stylesheet" href="css/main.css">
   <link rel="stylesheet" href="css/interfaces.css">

</head>
<body>
   <p>hello world1</p>
   <p>hello world2</p>
   <p>hello world3</p>
   <p>hello world4</p>
   <p>hello world5</p>
   <p>hello world6</p>
   <p>hello world7</p>
   <p>hello world8</p>

   <script>
      new Sortable(document.body, {
         group: 'nested',
         animation: 150,
         fallbackOnBody: true,
         swapThreshold: 0.65
      });
      let nestedSortables = document.getElementsByTagName("p");
      for (var i = 0; i < nestedSortables.length; i++) {
         new Sortable(nestedSortables[i], {
            group: 'nested',
            animation: 150,
            fallbackOnBody: true,
            swapThreshold: 0.65
         });
      }

   </script>
</body>
</html>
